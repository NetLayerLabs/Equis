name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # 24, not 22: package.json asks for >=22.18 and the scripts run TypeScript directly, but the
          # deciding factor is npm. Node 22 ships npm 10, which resolves this tree differently from the
          # npm 11 that wrote package-lock.json, and `npm ci` then rejects the lock as out of sync.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (includes lint + typecheck)
        run: npm run build
